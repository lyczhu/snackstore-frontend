name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-weapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      # pnpm 11 依赖 node:sqlite（Node 22.5+），node 20 会在 install/命令运行时
      # 抛 ERR_UNKNOWN_BUILTIN_MODULE，这里与 Dockerfile.web 保持一致用 24。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 依赖里 @swc/core/less/protobufjs 等的原生构建脚本对本项目非必需；
      # 关闭严格构建校验，避免 pnpm 因「ignored builds」直接失败（与本地一致）。
      - name: Install
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      # 格式门禁放在 lint 前：Prettier 比 ESLint 快，能更早失败。
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test (shared / weapp / admin / mobile)
        run: pnpm test

      # 微信小程序端：开发者工具「构建 npm」在 pnpm workspace 布局下静默空跑（POC-4），
      # 因此 miniprogram_npm 由脚本 vendor 生成，需在流水线中显式执行。
      - name: Vendor weapp miniprogram_npm
        run: pnpm --filter @snackstore/weapp run vendor:npm

      # 断言产物存在：依赖变更后若忘了 vendor，这里直接失败。
      - name: Verify miniprogram_npm artifacts
        run: |
          set -e
          test -d apps/weapp/miniprogram/miniprogram_npm/@vant/weapp \
            || { echo "缺少 miniprogram_npm/@vant/weapp"; exit 1; }
          test -f apps/weapp/miniprogram/miniprogram_npm/@vant/weapp/button/index.js \
            || { echo "缺少 @vant/weapp/button 组件"; exit 1; }
          test -f apps/weapp/miniprogram/miniprogram_npm/@snackstore/shared/index.js \
            || { echo "缺少 @snackstore/shared 纯模块入口"; exit 1; }
          echo "miniprogram_npm 产物校验通过"

      # 产物门禁：先构建，再查体积预算与源码泄漏。
      - name: Build all apps
        run: pnpm build

      # 根 pnpm size 内部会再跑一次 build，这里用 -r 只做检查，避免重复构建。
      - name: Size budget
        run: pnpm -r run size

      # hidden sourcemap 会把 .map 写进 dist，文件名可由 chunk 名推导，
      # 跟着静态资源上传即等于源码外泄。构建已默认关闭，这里是兜底断言。
      - name: Assert no sourcemap in dist
        run: |
          set -e
          leaks=$(find apps/mobile/dist apps/admin/dist -name '*.map' -print)
          if [ -n "$leaks" ]; then
            echo "检测到 sourcemap，禁止随静态资源发布："
            echo "$leaks"
            exit 1
          fi
          echo "未发现 .map"
